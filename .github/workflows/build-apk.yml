name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore, Environment and Google Services
        run: |
          chmod +x ./gradlew
          
          # Restore the permanent debug keystore from debug.keystore.base64
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Permanent debug keystore restored from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            echo "ERROR: debug.keystore.base64 not found! Stopping to prevent inconsistent random signing key."
            exit 1
          fi

          if [ ! -f .env.example ]; then
            echo 'GEMINI_API_KEY="dummy_key"' > .env.example
          fi

          if [ ! -f .env ]; then
            echo 'GEMINI_API_KEY="dummy_key"' > .env
          fi

          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"140084369102","project_id":"goli-accounting-erp","storage_bucket":"goli-accounting-erp.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:140084369102:android:65a4bc837d9210ef821bc1","android_client_info":{"package_name":"com.aistudio.goliaccounting.kxrvzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForGoliAccountingOnlineSync123"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -x test --no-daemon --stacktrace

      - name: Create Release and Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          tag: "v1.0.${{ github.run_number }}"
          name: "Goli Accounting App v1.0.${{ github.run_number }}"
          body: "دانلود مستقیم فایل APK برنامه حسابداری گلی (امضا شده با کلید دائمی و قابلیت به‌روزرسانی مستقیم)"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
